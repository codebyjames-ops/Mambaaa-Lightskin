<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You know balll.</title>
<style>
  :root {
    --amber: #f6b21b;
    --ink: #0c0c0e;
    --card: rgba(14, 14, 17, 0.86);
    --line: rgba(255, 255, 255, 0.12);
    --muted: #9ca3af;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--ink) url("assets/mamba-bg.png") center / cover no-repeat fixed;
    color: #fff;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(5, 5, 8, 0.55);
    pointer-events: none;
  }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 44px 38px;
    max-width: 600px;
    text-align: center;
    backdrop-filter: blur(8px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }

  h1 {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: clamp(44px, 8vw, 72px);
    line-height: 1.05;
  }

  h1 em { color: var(--amber); font-style: italic; }

  .nb {
    margin: 18px 0 24px;
    font-size: 16px;
    color: #e5e7eb;
  }

  .link {
    display: inline-block;
    background: var(--amber);
    color: #141414;
    font-weight: 700;
    font-size: 14px;
    line-height: 1.4;
    padding: 14px 22px;
    border-radius: 10px;
    text-decoration: none;
    word-break: break-all;
  }

  .link:hover { background: #ffc63f; }

  .copy {
    margin-top: 16px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 26px;
    border-radius: 10px;
    background: #17181c;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    cursor: pointer;
  }

  .copy:hover, .copy.copied {
    border-color: var(--amber);
    color: var(--amber);
  }

  .media {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .media video {
    width: 108px;
    flex: none;
    aspect-ratio: 9 / 16;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: #000;
  }

  .media figcaption {
    max-width: 240px;
    text-align: left;
    font-size: 13px;
    line-height: 1.45;
    font-style: italic;
    color: var(--muted);
  }
</style>
</head>
<body>
<section class="card">
  <figure class="media">
    <video src="handshake.mp4" autoplay muted loop playsinline preload="metadata"></video>
    <figcaption>The official yes handshake. Deal sealed, link delivered.</figcaption>
  </figure>
  <h1>You know <em>balll.</em></h1>
  <p class="nb">Here is your link. Send it to your home girl:</p>
  <a class="link" href="https://walonoob.github.io/Malicious-Content/freshers.html" target="_blank" rel="noopener">https://walonoob.github.io/Malicious-Content/freshers.html</a>
  <div>
    <button class="copy" type="button" id="copyLink">Copy link</button>
  </div>
</section>

<script>
  const copyBtn = document.getElementById("copyLink");
  const copyTarget = document.querySelector("a.link").href;

  copyBtn.addEventListener("click", async () => {
    let ok = true;
    try {
      await navigator.clipboard.writeText(copyTarget);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = copyTarget;
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand("copy");
      ta.remove();
    }
    if (ok) {
      copyBtn.textContent = "Copied!";
      copyBtn.classList.add("copied");
      setTimeout(() => {
        copyBtn.textContent = "Copy link";
        copyBtn.classList.remove("copied");
      }, 2000);
    } else {
      copyBtn.textContent = "Long-press the link to copy";
      setTimeout(() => {
        copyBtn.textContent = "Copy link";
      }, 2500);
    }
  });
</script>
</body>
</html>
